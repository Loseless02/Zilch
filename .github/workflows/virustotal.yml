name: virustotal

# Uploads the exe attached to every published release to VirusTotal and
# appends the report links to the release notes.
# Needs a repository secret VT_API_KEY (free VirusTotal account → API key).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Scan release assets
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: true
          files: |
            .exe$
